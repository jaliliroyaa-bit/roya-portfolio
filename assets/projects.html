<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>All Projects - Roya Jalili</title>
  <style>
    body { background: #EAF3F7; font-family: sans-serif; padding: 50px; }
    .filter-bar { display: flex; gap: 15px; justify-content: center; margin-bottom: 40px; }
    .btn { padding: 10px 20px; border-radius: 20px; border: 1px solid #333; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
    .card { background: white; padding: 15px; border-radius: 12px; }
    .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
  </style>
</head>
<body>
  <nav><a href="index.html">← Back to Home</a></nav>
  <h1>Full Project Archive</h1>
  
  <div class="filter-bar">
    <button class="btn" onclick="filter('all')">All</button>
    <button class="btn" onclick="filter('brand')">Brand & Identity</button>
    <button class="btn" onclick="filter('visual')">Visual Arts</button>
  </div>

  <div class="grid" id="project-grid">
    <div class="card" data-cat="brand"><img src="assets/TOPSPIN-cover.jpg"><h3>Project Name</h3></div>
    <div class="card" data-cat="visual"><img src="assets/chavosh-cover.jpg"><h3>Project Name</h3></div>
  </div>

  <script>
    function filter(cat) {
      document.querySelectorAll('.card').forEach(c => {
        c.style.display = (cat === 'all' || c.dataset.cat === cat) ? 'block' : 'none';
      });
    }
  </script>
</body>
</html>
