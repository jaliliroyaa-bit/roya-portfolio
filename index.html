<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roya Jalili - Creative Designer</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    *{box-sizing:border-box}
    :root{ --max:1280px; }
    
    body{margin:0; background: linear-gradient(120deg,#EAF3F7 0%,#D9EAF2 45%,#C9C4BC 100%); font-family: system-ui, sans-serif; overflow-x: hidden;}
    main { max-width: var(--max); margin: 3vh auto; border-radius: 24px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.1); background: linear-gradient(135deg, #7A9EAF 0%, #9EB8C5 30%, #8C8176 75%, #D4CEC7 100%); color: #ffffff; }
    
    .site-header { padding: 36px 96px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.15); }
    .logo { font-family: 'Caveat', cursive; font-weight: 700; font-size: 32px; }
    nav { display: flex; gap: 32px; }
    nav a { color: rgba(255, 255, 255, 0.75); font-size: 14px; font-weight: 500; }
    
    .hero { min-height: 50vh; padding: 10vh 96px; display: flex; flex-direction: column; justify-content: center; }
    h1 { font-size: clamp(40px, 6vw, 72px); line-height: 1.1; margin: 0 0 24px 0; }
    .hero-copy { max-width: 500px; font-size: 18px; line-height: 1.6; opacity: 0.9; }
    
    .section { padding: 60px 0; }
    .section-heading { padding: 0 96px; margin-bottom: 40px; }
    h2 { font-size: 40px; }
    
    .project-carousel { display: flex; gap: 30px; overflow-x: auto; padding: 10px 96px 60px; scrollbar-width: none; }
    .carousel-card { flex: 0 0 380px; position: relative; border-radius: 16px; overflow: hidden; }
    .carousel-card img { width: 100%; aspect-ratio: 16/11; object-fit: cover; }
    .project-info { padding: 20px 0; }
  </style>
</head>
<body>
  <main>
    <header class="site-header">
      <div class="logo">Roya Jalili</div>
      <nav>
        <a href="projects.html">Projects</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <section class="hero">
      <h1>Designing<br>with<br>intention.</h1>
      <p class="hero-copy">Exploring the space between traditional design and technology to create thoughtful visual stories.</p>
    </section>

    <section id="work" class="section">
      <div class="section-heading"><h2>Selected Work</h2></div>
      <div class="project-carousel">
        <div class="carousel-card"><img src="assets/TOPSPIN-cover.jpg"><div class="project-info"><h3>Topspin</h3></div></div>
        <div class="carousel-card"><img src="assets/car-cover.jpg"><div class="project-info"><h3>Faraz Dental</h3></div></div>
        <div class="carousel-card"><img src="assets/chavosh-cover.jpg"><div class="project-info"><h3>Mahboobe</h3></div></div>
      </div>
    </section>
  </main>
</body>
</html>
