<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Graphy — Roya Jalili</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#7FB2C9;
  --white:#fff;
  --soft:rgba(255,255,255,.76);
  --muted:rgba(255,255,255,.56);
  --line:rgba(255,255,255,.18);
  --glass:rgba(255,255,255,.075);
  --max:1240px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  color:#fff;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  background:linear-gradient(120deg,#DDECF2 0%,#E7EEF0 48%,#DEDAD4 100%);
}
a{color:inherit;text-decoration:none}
button{font:inherit}
.page-shell{width:min(var(--max),calc(100% - 72px));margin:0 auto;padding:22px 0 42px}
.page{
  position:relative;overflow:hidden;min-height:calc(100vh - 44px);
  border-radius:26px;border:1px solid rgba(255,255,255,.18);
  box-shadow:0 20px 60px rgba(0,0,0,.10);
  background:linear-gradient(135deg,#7FB2C9 0%,#82AFC2 34%,#969E9D 68%,#AAA49C 100%);
}
.page::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 15% 14%,rgba(255,255,255,.10),transparent 28%),
    radial-gradient(circle at 88% 82%,rgba(255,255,255,.06),transparent 30%);
}
.inner{position:relative;z-index:1;padding:28px 68px 42px}
.site-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 2px 24px;border-bottom:1px solid rgba(255,255,255,.16)
}
.logo{font-family:"Caveat",cursive;font-size:32px;font-weight:700;line-height:1;letter-spacing:1px}
.back{
  display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:999px;
  border:1px solid rgba(255,255,255,.23);background:rgba(255,255,255,.07);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:rgba(255,255,255,.88);font-size:12px;font-weight:600;transition:.2s ease
}
.back:hover{background:rgba(255,255,255,.13);transform:translateX(-2px)}
.intro{max-width:690px;padding:36px 0 24px}
.eyebrow{
  margin:0 0 8px;font-size:10px;line-height:1;letter-spacing:.16em;
  text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.62)
}
.intro h1{
  margin:0;
  font-size:clamp(42px,5vw,66px);
  line-height:.98;
  font-weight:500;
  letter-spacing:-.045em;
  color:#3F464A;
}
.intro p:last-child{
  max-width:640px;margin:18px 0 0;font-size:14px;line-height:1.75;color:rgba(255,255,255,.78)
}
.gallery-layout{
  display:grid;
  grid-template-columns:minmax(280px,1fr) minmax(320px,430px);
  align-items:center;
  gap:clamp(52px,7vw,100px);
  padding:24px 0 18px;
  min-height:610px;
}
.series-panel{
  width:min(100%,430px);
  justify-self:start;
  text-align:left;
}
.series-kicker{
  margin:0 0 12px;
  font-size:11px;
  line-height:1;
  font-weight:600;
  letter-spacing:.06em;
  color:rgba(255,255,255,.56);
}

.series-panel h2{
  margin:0 0 14px;
  font-size:clamp(30px,3.2vw,42px);
  line-height:1.04;
  font-weight:500;
  letter-spacing:-.04em;
}

.series-description{
  max-width:360px;
  margin:0;
  font-size:14px;
  line-height:1.68;
  color:rgba(255,255,255,.74);
}
.series-nav{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:flex-start;
  gap:9px;
  margin-top:28px;
  border:0;
}

.series-tab{
  appearance:none;
  display:inline-flex;
  align-items:center;
  justify-content:flex-start;
  gap:7px;

  padding:10px 14px;

  border:1px solid rgba(255,255,255,.18);
  border-radius:999px;

  background:rgba(255,255,255,.035);
  color:rgba(255,255,255,.64);

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

  cursor:pointer;

  font-size:10px;
  line-height:1;
  font-weight:600;
  letter-spacing:.055em;
  text-transform:uppercase;

  transition:
    background .18s ease,
    border-color .18s ease,
    color .18s ease,
    transform .18s ease;
}

.series-tab:hover{
  color:rgba(255,255,255,.92);
  background:rgba(255,255,255,.10);
  border-color:rgba(255,255,255,.30);
  transform:translateY(-1px);
}

.series-tab.active{
  color:#fff;
  background:rgba(255,255,255,.14);
  border-color:rgba(255,255,255,.36);
}

.series-tab span{
  display:inline-block;
  width:auto;
  color:rgba(255,255,255,.48);
}

.series-tab.active span{
  color:rgba(255,255,255,.82);
}

.viewer-column{position:relative;width:100%;max-width:430px;justify-self:start}
.story-wrap{position:relative;width:min(100%,350px);margin:0 auto}
.story-frame{
  position:relative;width:100%;aspect-ratio:9/16;padding:10px;border-radius:30px;
  border:1px solid rgba(255,255,255,.36);
  background:linear-gradient(145deg,rgba(255,255,255,.24),rgba(255,255,255,.07));
  box-shadow:0 18px 40px rgba(32,48,56,.10),inset 0 1px 0 rgba(255,255,255,.25);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)
}
.story-screen{
  position:relative;overflow:hidden;width:100%;height:100%;
  border-radius:22px;background:rgba(0,0,0,.12)
}
.story-image{
  display:block;width:100%;height:100%;object-fit:cover;opacity:1;transform:scale(1);
  transition:opacity .20s ease,transform .28s ease
}
.story-screen.is-changing .story-image{opacity:0;transform:scale(.985)}
.story-overlay{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.26) 0%,rgba(0,0,0,0) 21%,rgba(0,0,0,0) 76%,rgba(0,0,0,.18) 100%)
}
.story-top{position:absolute;z-index:2;top:12px;left:12px;right:12px}
.progress{
  display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;margin-bottom:10px
}
.progress span{display:block;height:2px;border-radius:999px;background:rgba(255,255,255,.34)}
.progress span.done,.progress span.active{background:rgba(255,255,255,.92)}
.story-user{
  display:flex;align-items:center;gap:7px;font-size:10px;font-weight:700;color:#fff
}
.avatar{
  width:24px;height:24px;overflow:hidden;border-radius:50%;
  border:1px solid rgba(255,255,255,.62);background:rgba(255,255,255,.16)
}
.avatar img{width:100%;height:100%;object-fit:cover}
.story-time{color:rgba(255,255,255,.58);font-weight:500}
.story-more{margin-left:auto;font-size:16px;line-height:1;letter-spacing:2px}
.story-bottom{
  position:absolute;z-index:2;left:12px;right:12px;bottom:12px;
  display:flex;align-items:center;gap:9px
}
.reply{
  flex:1;padding:8px 12px;border:1px solid rgba(255,255,255,.68);border-radius:999px;
  font-size:9px;color:rgba(255,255,255,.88);background:rgba(255,255,255,.04);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)
}
.story-icon{width:19px;height:19px}
.story-icon svg{
  width:100%;height:100%;fill:none;stroke:#fff;stroke-width:1.55;
  stroke-linecap:round;stroke-linejoin:round
}
.arrow{
  position:absolute;z-index:4;top:50%;width:40px;height:40px;padding:0;display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.27);border-radius:50%;background:rgba(255,255,255,.065);
  color:#fff;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transform:translateY(-50%);transition:.18s ease
}
.arrow:hover{background:rgba(255,255,255,.14)}
.arrow.prev{left:-58px}.arrow.next{right:-58px}
.arrow svg{
  width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round
}
.slide-meta{
  width:min(100%,350px);margin:14px auto 0;display:flex;align-items:center;
  justify-content:space-between;gap:16px
}
.slide-count{
  display:flex;align-items:center;gap:10px;font-size:10px;font-weight:700;color:rgba(255,255,255,.78)
}
.slide-count .line{width:42px;height:1px;background:rgba(255,255,255,.28)}
.dots{display:flex;align-items:center;gap:6px}
.dots span{
  width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.28);transition:.18s ease
}
.dots span.active{width:18px;border-radius:999px;background:rgba(255,255,255,.92)}
@media(max-width:900px){
  .page-shell{width:calc(100% - 28px);padding:14px 0 28px}
  .inner{padding:24px 30px 34px}
  .gallery-layout{grid-template-columns:1fr;gap:28px;min-height:0}

  .series-panel{
    width:min(100%,520px);
    justify-self:center;
    text-align:left;
  }

  .series-description{
    margin-left:0;
    margin-right:0;
  }

  .series-nav{
    justify-content:flex-start;
    margin-top:24px;
  }

  .viewer-column{justify-self:center}
}
@media(max-width:520px){
  .inner{padding-left:20px;padding-right:20px}
  .site-header{gap:12px}
  .logo{font-size:28px}
  .back{font-size:10px;padding:8px 10px}
  .intro{padding-top:28px}
  .intro h1{font-size:44px}
  .intro p:last-child{font-size:13px}
  .story-wrap,.slide-meta{width:78vw}
  .arrow{width:36px;height:36px}
  .arrow.prev{left:-44px}.arrow.next{right:-44px}
}

/* Story UI cleanup */
.story-meta,
.story-caption,
.story-info,
.story-badge,
.story-label,
.story-location,
.story-time{
  display:none !important;
}

</style>
</head>
<body>
<div class="page-shell">
<main class="page">
<div class="inner">

<header class="site-header">
  <a class="logo" href="index.html">Roya Jalili</a>
  <a class="back" href="projects.html">← Back to Project Archive</a>
</header>

<section class="intro">
  <h1>Mobile Graphy</h1>
  <p>
    Everyday photographs, collected along the way.
  </p>
</section>

<section class="gallery-layout">

<aside class="series-panel">
  <div class="series-kicker" id="seriesKicker">Collection 01</div>

  <h2 id="seriesTitle">Market Stories</h2>

  <p class="series-description" id="seriesDescription">
    Old shops, familiar faces, and everyday work inside traditional markets.
  </p>

  <div class="series-nav" aria-label="Photography collections">
    <button class="series-tab active" type="button" data-series="market">
      <span>01</span> Market Stories
    </button>

    <button class="series-tab" type="button" data-series="wandering">
      <span>02</span> Wandering
    </button>
  </div>
</aside>

<div class="viewer-column">
<div class="story-wrap">

<button class="arrow prev" id="prevSlide" type="button" aria-label="Previous photo">
  <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
</button>

<div class="story-frame">
<div class="story-screen" id="storyScreen">
  <img class="story-image" id="storyImage" src="assets/mobile-graphy/market-01.jpg" alt="">
  <div class="story-overlay"></div>

  <div class="story-top">
    <div class="progress" id="storyProgress"></div>
    <div class="story-user">
      <div class="avatar"><img src="assets/portrait.jpg" alt=""></div>
      <span>Dream</span>
      <span class="story-time">now</span>
      <span class="story-more">•••</span>
    </div>
  </div>

  <div class="story-bottom">
    <div class="reply">Send message...</div>
    <span class="story-icon">
      <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
    </span>
    <span class="story-icon">
      <svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>
    </span>
  </div>
</div>
</div>

<button class="arrow next" id="nextSlide" type="button" aria-label="Next photo">
  <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
</button>

</div>

<div class="slide-meta">
  <div class="slide-count">
    <span id="currentSlide">01</span>
    <span class="line"></span>
    <span id="totalSlides">06</span>
  </div>
  <div class="dots" id="slideDots" aria-hidden="true"></div>
</div>

</div>
</section>

</div>
</main>
</div>

<script>
const series = {
  market: {
    number: "01",
    title: "Market Stories",
    description: "Old shops, familiar faces, and everyday work inside traditional markets.",
    slides: [
      "assets/mobile-graphy/market-01.jpg",
      "assets/mobile-graphy/market-02.jpg",
      "assets/mobile-graphy/market-03.jpg",
      "assets/mobile-graphy/market-04.jpg",
      "assets/mobile-graphy/market-05.jpg",
      "assets/mobile-graphy/market-06.jpg"
    ]
  },
  wandering: {
    number: "02",
    title: "Wandering",
    description: "Unplanned walks through the city — light, streets, details, and moments noticed in passing.",
    slides: [
      "assets/mobile-graphy/wandering-01.jpg",
      "assets/mobile-graphy/wandering-02.jpg",
      "assets/mobile-graphy/wandering-03.jpg",
      "assets/mobile-graphy/wandering-04.jpg",
      "assets/mobile-graphy/wandering-05.jpg",
      "assets/mobile-graphy/wandering-06.jpg",
      "assets/mobile-graphy/wandering-07.jpg",
      "assets/mobile-graphy/wandering-08.jpg",
      "assets/mobile-graphy/wandering-09.jpg",
      "assets/mobile-graphy/wandering-10.jpg"
    ]
  }
};

const seriesOrder = ["market","wandering"];
const storyScreen = document.getElementById("storyScreen");
const storyImage = document.getElementById("storyImage");
const storyProgress = document.getElementById("storyProgress");
const seriesKicker = document.getElementById("seriesKicker");
const seriesTitle = document.getElementById("seriesTitle");
const seriesDescription = document.getElementById("seriesDescription");
const currentSlide = document.getElementById("currentSlide");
const totalSlides = document.getElementById("totalSlides");
const slideDots = document.getElementById("slideDots");
const prevSlide = document.getElementById("prevSlide");
const nextSlide = document.getElementById("nextSlide");
const tabs = [...document.querySelectorAll(".series-tab")];

let activeSeries = "market";
let index = 0;
let touchStartX = null;

function pad(n){ return String(n).padStart(2,"0"); }

function buildProgress(){
  storyProgress.innerHTML = "";
  series[activeSeries].slides.forEach((_,i)=>{
    const bar = document.createElement("span");
    if(i < index) bar.classList.add("done");
    if(i === index) bar.classList.add("active");
    storyProgress.appendChild(bar);
  });
}

function buildDots(){
  slideDots.innerHTML = "";
  series[activeSeries].slides.forEach((_,i)=>{
    const dot = document.createElement("span");
    dot.classList.toggle("active",i === index);
    slideDots.appendChild(dot);
  });
}

function updateSeriesInfo(){
  const current = series[activeSeries];
  seriesKicker.textContent = `Collection ${current.number}`;
  seriesTitle.textContent = current.title;
  seriesDescription.textContent = current.description;
  tabs.forEach(tab=>tab.classList.toggle("active",tab.dataset.series === activeSeries));
}

function renderSlide(animate=true){
  const current = series[activeSeries];
  const nextSrc = current.slides[index];

  const swap = ()=>{
    storyImage.src = nextSrc;
    storyImage.alt = "";
    currentSlide.textContent = pad(index+1);
    totalSlides.textContent = pad(current.slides.length);
    buildProgress();
    buildDots();
    updateSeriesInfo();
    requestAnimationFrame(()=>storyScreen.classList.remove("is-changing"));
  };

  if(!animate){ swap(); return; }

  storyScreen.classList.add("is-changing");
  setTimeout(swap,160);
}

function switchSeries(key){
  if(!series[key]) return;
  activeSeries = key;
  index = 0;
  renderSlide();
}

function next(){
  const current = series[activeSeries];
  if(index < current.slides.length - 1){
    index++;
    renderSlide();
    return;
  }
  const currentSeriesIndex = seriesOrder.indexOf(activeSeries);
  const nextSeriesIndex = (currentSeriesIndex + 1) % seriesOrder.length;
  activeSeries = seriesOrder[nextSeriesIndex];
  index = 0;
  renderSlide();
}

function previous(){
  if(index > 0){
    index--;
    renderSlide();
    return;
  }
  const currentSeriesIndex = seriesOrder.indexOf(activeSeries);
  const previousSeriesIndex = (currentSeriesIndex - 1 + seriesOrder.length) % seriesOrder.length;
  activeSeries = seriesOrder[previousSeriesIndex];
  index = series[activeSeries].slides.length - 1;
  renderSlide();
}

tabs.forEach(tab=>tab.addEventListener("click",()=>switchSeries(tab.dataset.series)));
prevSlide.addEventListener("click",previous);
nextSlide.addEventListener("click",next);

document.addEventListener("keydown",e=>{
  if(e.key === "ArrowLeft") previous();
  if(e.key === "ArrowRight") next();
});

storyScreen.addEventListener("touchstart",e=>{
  touchStartX = e.changedTouches[0].clientX;
},{passive:true});

storyScreen.addEventListener("touchend",e=>{
  if(touchStartX === null) return;
  const delta = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(delta) > 45){
    if(delta < 0) next();
    else previous();
  }
  touchStartX = null;
},{passive:true});

renderSlide(false);
</script>
</body>
</html>
